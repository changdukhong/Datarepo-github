<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>의병장 영상 갤러리</title>
<style>
  .mygallery {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    margin-top: 20px; /* 텍스트와 썸네일 사이 1줄 간격 */
  }
  .mygallery img {
    width: 120px;               /* 썸네일 크기 */
    height: auto;
    cursor: pointer;
    border: 2px solid #ccc;
    border-radius: 6px;
    transition: transform 0.2s, border-color 0.2s;
  }
  .mygallery img:hover {
    transform: scale(1.05);
    border-color: #666;
  }
  .thumb-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 160px;
  }
  .thumb-box img {
    width: 160px;       /* 썸네일 가로 크기 */
    height: 90px;       /* 썸네일 세로 크기 */
    object-fit: contain; /* 이미지 전체가 보이도록 */
    background-color: #000; /* 여백 부분은 검정 배경 */
    cursor: pointer;
    border: 2px solid #ccc;
    transition: 0.3s;
  }
  .thumb-box img:hover {
    border-color: #0000ff;
  }
  .thumb-caption {
    margin-top: 6px;
    font-size: 14px;
    text-align: center;
    color: #333;
  }
  #player {
    display: block;
    margin: 20px auto 10px auto; /* 영상 위아래 여백 */
    width: 426px;                /* 기존 640px의 2/3 크기 */
    max-width: 100%;
    border: 3px solid #006400;   /* 짙은 녹색 테두리 */
    border-radius: 0px;
  }
  #description {
    text-align: center;
    font-size: 16px;
    margin-bottom: 10px; /* 텍스트와 썸네일 사이 여백 */
    font-weight: bold;
    color: #333;
  }
</style>
</head>
<body>

<!-- 재생 영역 -->
<video id="player" controls preload="metadata" poster="" controlslist="nodownload nofullscreen">
  <source src="" type="video/mp4">
  브라우저가 video 태그를 지원하지 않습니다.
</video>

<!-- 설명 텍스트 영역 -->
<div id="description">영상 설명이 여기에 표시됩니다.</div>

<!-- 썸네일 영역 -->
<div class="mygallery">
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb1.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video1.mp4" 
         data-text=" 1592년 4월 13일(음), 왜적이 부산 앞바다에 출현하며 7년간의 전쟁이 시작되었고, 무고한 백성들은 ‘어육지화’로 참혹한 학살을 당함" 
         alt="Video 1">
    <div class="thumb-caption">임진전쟁 발발</div>
  </div>
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb10.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video10.mp4" 
         data-text="1592년 4월 왜군이 침입하자 자제와 노복, 인근 친척, 유민들을 모아 대구부 금강 금정에서 의병대를 조직함" 
         alt="Video 10">
    <div class="thumb-caption">감란의병 창의</div>
  </div>
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb2.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video2.mp4" 
         data-text=" 1592년 임진왜란 발발 당시 척제공 장몽기 의병장이 대구 와룡산 아래에 설치한 의병 병영을 일컫음" 
         alt="Video 2">
    <div class="thumb-caption">비유 와룡진</div>
  </div>
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb3.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video3.mp4" 
         data-text="왜군이 침공(임진왜란 및 정유재란)한 1592년부터 7년간 조선 전역을 참혹한 전란으로 몰아넣은 전쟁임" 
         alt="Video 3">
    <div class="thumb-caption">왜군 침공</div>
  </div>
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb4.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video4.mp4" 
         data-text="임진왜란과 정유재란 당시 대구 지역을 중심으로 의병 활동하며 구국에 헌신한 대표적인 의병장임" 
         alt="Video 4">
    <div class="thumb-caption">장몽기 의병장</div>
  </div>
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb5.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video5.mp4" 
         data-text="수천 명의 왜군 집결 소식을 듣고 용마를 타고 날듯이 달려가 단번에 적진을 격파하며, 패주하는 적을 끝까지 추격하여 수많은 적을 무찔렀음" 
         alt="Video 5">
    <div class="thumb-caption">비유장군 돌격</div>
  </div>
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb6.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video6.mp4" 
         data-text="장몽기와 최동보 의병장은 임진왜란 전후로 ‘호형호제’하며 생사고락을 함께하고 수시 시국을 논하고 공동전투를 위한 전술을 논의함" 
         alt="Video 6">
    <div class="thumb-caption">의병장 작전논의 </div>
  </div>
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb7.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video7.mp4" 
         data-text="곽재우, 장몽기 등 열읍 의병장들의 활약으로 영남지역의 중요한 방어 거점인 화왕산성에서 왜적의 북상을 저지함 " 
         alt="Video 7">
    <div class="thumb-caption">화왕산성 전투</div>
  </div>
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb8.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video8.mp4" 
         data-text="1597년 8월 29일부터 6일간 대구 달성지역에서 벌어진 전투로, 관군과 의병이 협력하여 왜군의 북진을 저지한 기념비적인 전투임" 
         alt="Video 8">
    <div class="thumb-caption">달성 전투</div>
  </div>
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb9.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video9.mp4" 
         data-text="1597년 정유재란 당시 함창 당교 전투에서 적의 유탄에 맞아 비장하고도 장렬한 죽음을 맞이함" 
         alt="Video 9">
    <div class="thumb-caption">비유장군 순절</div>
  </div>
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb14.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video14.mp4" 
         data-text="순조 14년(1814), 후손들의 애절한 상소와 함께 그의 충절이 재 인정되어 자헌대부 호조판서, 오위도총부 도총관으로 증직됨" 
         alt="Video 14">
    <div class="thumb-caption">교지 하사</div>
  </div>
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb15.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video15.mp4" 
         data-text="나라의 위기 앞에서 자신을 던졌던 장몽기 의병장과 103위 감란의병 충의지사들의 구국충절과 희생정신을 계승과 의병장의 높은 기개를 기리기 위함임" 
         alt="Video 15">
    <div class="thumb-caption">사당 참배</div>
  </div>    
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb11.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video11.mp4" 
         data-text="충의림 내에 의병들의 불굴의 항쟁 정신을 충절비와 열전비에 새겨 영원히 전하고자 두 개의 비석을 나란히 세움" 
         alt="Video 11">
    <div class="thumb-caption">충절비-열전비(충의림)</div>
  </div>
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb12.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video12.mp4" 
         data-text="전란을 진압하고 충의를 지킨 감란의병들의 숭고한 뜻을 기리기 위해 대구부 금강의 금정 정자를 디지털로 복원함" 
         alt="Video 12">
    <div class="thumb-caption">감란의병 정자</div>
  </div>
  <div class="thumb-box">
    <img src="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/thumb13.jpg" 
         data-video="https://raw.githubusercontent.com/changdukhong/Datarepo-github/master/thumb-video/video13.mp4" 
         data-text="금갑노인, 귀면도깨비, 의병장, 처용, 오니도깨비, 사무라이1/2, 지킴이 아바타로 '척제공 장몽기 의병역사자료관' 방문을 환영함" 
         alt="Video 13">
    <div class="thumb-caption">아바타 환영인사</div>
  </div>
</div>


<script>
  // 전역 변수 선언
  let currentDescription = "";

  // 갤러리 영역에 이벤트 위임
  document.addEventListener('DOMContentLoaded', () => {
    const mygallery = document.querySelector('.mygallery');
    const player = document.getElementById('player');
    const source = player.querySelector('source');
    const description = document.getElementById('description');

    // 갤러리 클릭 이벤트 (자식 img에만 반응)
    mygallery.addEventListener('click', (e) => {
      const target = e.target;
      if (target.tagName.toLowerCase() === 'img') {
        const videoSrc = target.dataset.video;
        const posterSrc = target.src;
        const text = target.dataset.text;

        source.src = videoSrc;
        player.poster = posterSrc;
        player.load();
        player.play();

        currentDescription = text;
        description.textContent = text;
      }
    });

    // 영상 종료 시 안내 문구
    player.addEventListener('ended', () => {
      description.textContent = "영상이 종료되었습니다.";
      player.currentTime = 0;
      player.load();
    });

    // 영상 다시 재생할 때 설명 복원
    player.addEventListener('play', () => {
      if (currentDescription) {
        description.textContent = currentDescription;
      }
    });
  });
</script>

</body>
</html>
